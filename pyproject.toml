[project]
name = "movie-llm"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.0",
    "av>=14",
    "huggingface-hub>=1.0",
    "openai>=3.26.1",
    "pandas>=3.0.6",
    "peft>=0.15",
    "pillow>=10",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.4",
    "torch>=2.9",
    "torchvision>=0.24",
    "transformers>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["movie_llm"]
